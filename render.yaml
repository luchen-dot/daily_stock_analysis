# Render.com deployment configuration
# https://render.com/docs/blueprint-spec
#
# Deploy steps:
#   1. Connect your GitHub repo at https://dashboard.render.com
#   2. Render will detect this file automatically
#   3. Set the required environment variables in the Render dashboard:
#        GEMINI_API_KEY  (required)
#        STOCK_LIST      (e.g. 600519,AAPL)
#   4. Click "Create Web Service"

services:
  - type: web
    name: daily-stock-analysis
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    # Override Dockerfile CMD to run in web-only mode (no scheduler, no notifications)
    dockerCommand: python main.py --serve-only
    # Render free tier: service sleeps after 15 min of inactivity
    plan: free
    healthCheckPath: /api/health

    envVars:
      # ── Server ──────────────────────────────────────────────────────────────
      - key: WEBUI_HOST
        value: 0.0.0.0
      - key: WEBUI_ENABLED
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TZ
        value: Asia/Shanghai

      # ── LLM API Keys (set these in the Render dashboard, NOT here) ──────────
      # - key: GEMINI_API_KEY
      #   value: your-key-here
      # - key: OPENAI_API_KEY
      #   value: your-key-here
      # - key: ANTHROPIC_API_KEY
      #   value: your-key-here

      # ── Stock list ───────────────────────────────────────────────────────────
      # Comma-separated stock codes; override in Render dashboard as needed
      - key: STOCK_LIST
        value: 600519,300750,AAPL,TSLA

      # ── Features (disable scheduler and notifications in cloud mode) ─────────
      - key: SCHEDULE_ENABLED
        value: "false"
      - key: AGENT_MODE
        value: "true"

      # ── Database (ephemeral on Render free tier — data resets on redeploy) ───
      - key: DATABASE_PATH
        value: /app/data/stock_analysis.db
